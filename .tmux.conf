##### General #####
set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Prefix #####
# Change prefix from Ctrl-b to Ctrl-a (like GNU screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Splitting panes #####
# Easier splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

##### Reload config #####
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

##### Pane navigation #####
# Vim-style movement between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5
bind-key -r C-h resize-pane -L 5

# Make `Ctrl+A R` reload the config file
unbind r
bind r source-file ~/.tmux.conf

##### General #####
set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Prefix #####
# Change prefix from Ctrl-b to Ctrl-a (like GNU screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Splitting panes #####
# Easier splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

##### Reload config #####
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

##### Pane navigation #####
# Vim-style movement between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Resize panes #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Copy mode (vim-style) #####
setw -g mode-keys vi

# Start selection with v, copy with y
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### Status bar #####
set -g status-interval 5
set -g status-justify centre

# Simple clean look
set -g status-style bg=colour234,fg=colour137

set -g status-left-length 50
set -g status-right-length 50

set -g status-left "#[fg=colour39]#S #[fg=colour245]|"
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour39]%H:%M"

# Window tabs
setw -g window-status-format "#[fg=colour245] #I:#W "
setw -g window-status-current-format "#[fg=colour231,bg=colour39,bold] #I:#W "

##### Better visuals #####
# Highlight active pan
# Highlight active pane
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

##### Misc #####
set -g escape-time 10
set -g focus-events on
